name: CI

# Type check, lint and build every pull request and push, so a broken
# change is caught before it reaches main (which builds the image).
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Built inside the Dockerfile's Alpine image rather than on the Ubuntu
      # runner: package-lock.json only has sharp's Alpine (musl) binaries,
      # which is also what production uses. Any API URL works for the check.
      - name: Build
        run: >
          docker build --target builder
          --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          -t frontend-ui:ci .
